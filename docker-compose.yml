services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mobijob
      POSTGRES_PASSWORD: mobijob
      POSTGRES_DB: mobijob
    ports:
      - "5432:5432"
    volumes:
      - mobijob_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobijob -d mobijob"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mobijob_pg:
