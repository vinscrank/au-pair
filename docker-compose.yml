services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aupair
      POSTGRES_PASSWORD: aupair
      POSTGRES_DB: aupair
    ports:
      - "5432:5432"
    volumes:
      - aupair_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aupair -d aupair"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aupair_pg:
